[project]
name = "diarizen-inference"
version = "0.1.0"
description = "DiariZen inference runtime for meeting diarization"
requires-python = ">=3.10"
dependencies = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "huggingface-hub>=0.28.1",
    "numpy==1.26.4",
    "scipy",
    "soundfile",
    "toml",
    "accelerate==1.6.0",
    "psutil",
    "torchcodec",
    "setuptools<81",
    "diarizen @ git+https://github.com/BUTSpeechFIT/DiariZen.git",
    "pyannote-audio @ git+https://github.com/BUTSpeechFIT/DiariZen.git#subdirectory=pyannote-audio",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.extra-build-dependencies]
pyannote-audio = ["setuptools<81"]
