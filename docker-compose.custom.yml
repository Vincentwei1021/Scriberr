version: "3.9"
services:
  scriberr:
    build:
      context: .
      dockerfile: Dockerfile.custom
    ports:
      - "8080:8080"
    volumes:
      - scriberr_data:/app/data
      - env_data:/app/whisperx-env
      - ./pretrained_models_firered:/app/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FIRERED_MODEL_DIR=/app/models/FireRedASR2-AED
      - FIRERED_MODEL_DIR_LLM=/app/models/FireRedASR2-LLM
      - FIRERED_SOURCE_DIR=/app/FireRedASR2S
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      - APP_ENV=production
      - DISABLE_AUTH=true
      - SECURE_COOKIES=false
      - OPENAI_API_KEY=sk-placeholder
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - ENABLED_ADAPTERS=firered_asr,qwen3_asr,campp,pyannote

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  scriberr_data: {}
  env_data: {}
